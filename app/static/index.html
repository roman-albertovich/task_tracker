<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        .task-item { border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 4px; }
        .task-status { inline-size: fit-content; padding: 2px 6px; background: #eee; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Управление задачами</h1>

    <div class="task-form">
        <div class="form-group">
            <label for="taskName">Название задачи:</label>
            <input type="text" id="taskName" placeholder="Введите название (макс 100 символов)">
        </div>
        <div class="form-group">
            <label for="taskAuthor">Автор:</label>
            <input type="text" id="taskAuthor" placeholder="Имя автора">
        </div>
        <div class="form-group">
            <label for="taskDesc">Описание:</label>
            <textarea id="taskDesc" rows="3" placeholder="Описание задачи"></textarea>
        </div>
        <button id="btnCreate" onclick="createTask()">Добавить задачу</button>
    </div>

    <h2>Список задач</h2>
    <div id="tasksList"></div>

    <script>
        const API_URL = '/tasks';

        // Функция получения и отрисовки задач
        async function loadTasks() {
            const res = await fetch(API_URL);
            const tasks = await res.json();
            const container = document.getElementById('tasksList');
            container.innerHTML = '';

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = `
                    <h3 class="task-title">${task.name}</h3>
                    <p>${task.description || 'Нет описания'}</p>
                    <div><strong>Автор:</strong> ${task.author}</div>
                    <div class="task-status">${task.status}</div>
                `;
                container.appendChild(div);
            });
        }

        // Функция отправки новой задачи на бэкенд
        async function createTask() {
            const name = document.getElementById('taskName').value;
            const author = document.getElementById('taskAuthor').value;
            const description = document.getElementById('taskDesc').value;

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, author, description })
            });

            if (res.ok) {
                // Очищаем форму и обновляем список
                document.getElementById('taskName').value = '';
                document.getElementById('taskAuthor').value = '';
                document.getElementById('taskDesc').value = '';
                await loadTasks();
            } else {
                alert('Ошибка валидации данных!');
            }
        }

        // Загружаем список при открытии страницы
        loadTasks();
    </script>
</body>
</html>
